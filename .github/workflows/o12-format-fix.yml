name: O12 Format Fix

on:
  push:
    branches: [post-mvp/o12-reclamation-audit]
    paths: [.github/workflows/o12-format-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-mvp/o12-reclamation-audit
      - name: Apply exact Ruff normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/dev_workspace_mcp/tools/prune.py")
          text = path.read_text()
          old = "    )\n\n\n\ndef _audit_plan_reason"
          new = "    )\n\n\ndef _audit_plan_reason"
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove helper and commit
        run: |
          git rm .github/workflows/o12-format-fix.yml
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add src/dev_workspace_mcp/tools/prune.py
          git commit -m "style: format O12 reclamation audit"
          git push origin HEAD:post-mvp/o12-reclamation-audit
