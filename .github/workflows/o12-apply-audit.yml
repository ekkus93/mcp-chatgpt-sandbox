name: O12 Apply Audit

on:
  push:
    branches: [post-mvp/o12-reclamation-audit]
    paths: [.github/workflows/o12-apply-audit.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-mvp/o12-reclamation-audit
      - run: python scripts/o12_apply_audit.py
      - run: git rm .github/workflows/o12-apply-audit.yml scripts/o12_apply_audit.py
      - run: |
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add src/dev_workspace_mcp/tools/prune.py
          git commit -m "feat: audit reclamation decisions safely"
          git push origin HEAD:post-mvp/o12-reclamation-audit
