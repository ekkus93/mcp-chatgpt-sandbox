name: R1 Apply Audit Attribution

on:
  push:
    branches:
      - post-mvp/review-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/post-mvp/review-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R1 audit attribution patch
        run: python scripts/r1_apply_audit_attribution.py
