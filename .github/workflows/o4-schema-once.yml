name: Generate O4 contract once

on:
  push:
    branches: [post-mvp/o4-pressure-diagnostics]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'stage O4 schema generation'
    runs-on: [self-hosted, mcp-chatgpt-sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: post-mvp/o4-pressure-diagnostics

      - name: Verify exact staging head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Export and verify O4 contract
        shell: bash
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          cat > "$config_dir/config.yml" <<EOF
          version: 1
          state_db_path: $config_dir/state.db
          docker:
            default_image: mcp-dev-ubuntu:24.04
          ssh:
            keys_dir: $config_dir/keys
            known_hosts: $config_dir/known_hosts
          audit:
            path: $config_dir/audit.jsonl
          EOF
          uv run dev-workspace-mcp export-schemas \
            --config "$config_dir/config.yml" \
            --out schemas/tools.json
          jq -e '.contract_version == "0.8.1"' schemas/tools.json >/dev/null
          jq -e '(.tools | length) == 22' schemas/tools.json >/dev/null
          jq -e 'any(.tools[]; .name == "exec" and (.output_schema.properties.pressure != null))' schemas/tools.json >/dev/null
          jq -e 'any(.tools[]; .name == "resource_inventory" and (.output_schema.properties.pid_pressure != null))' schemas/tools.json >/dev/null

      - name: Publish generated contract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/o4-schema-once.yml
          git add schemas/tools.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate O4 MCP contract'
          git push origin HEAD:post-mvp/o4-pressure-diagnostics
