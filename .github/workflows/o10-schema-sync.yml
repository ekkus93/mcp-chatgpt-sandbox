name: O10 schema sync

on:
  push:
    branches: [post-mvp/o10-operational-health]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, mcp-chatgpt-sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Export canonical tool schema
        run: |
          config_dir="$(mktemp -d)"
          cat > "$config_dir/config.yml" <<EOF
          version: 1
          state_db_path: $config_dir/state.db
          docker:
            default_image: mcp-dev-ubuntu:24.04
          ssh:
            keys_dir: $config_dir/keys
            known_hosts: $config_dir/known_hosts
          audit:
            path: $config_dir/audit.jsonl
          EOF
          uv run dev-workspace-mcp export-schemas \
            --config "$config_dir/config.yml" \
            --out schemas/tools.json

      - name: Commit generated schema
        run: |
          if git diff --quiet -- schemas/tools.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add schemas/tools.json
          git commit -m "chore: regenerate O10 tool schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
