name: O10 close TODO

on:
  push:
    branches: [post-mvp/o10-operational-health]

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, mcp-chatgpt-sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update O10 closure evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/POST_MVP_OPERATIONS_TODO.md")
          text = path.read_text()
          text = text.replace(
              "**Status:** open — O1-O9 complete; O10-O12 remain",
              "**Status:** open — O1-O10 complete; O11-O12 remain",
              1,
          )
          old = '''- [ ] Decide additive `server_info` shape for operational pressure/inventory degradation
          - [ ] Keep unavailable metrics distinguishable from healthy zero usage
          - [ ] Preserve existing audit and maintenance health sections
          - [ ] Do not make optional pressure probes block server startup
          - [ ] Bump contract version and regenerate schemas/docs
          - [ ] Test healthy, pressured, degraded-probe, and recovered states

          ### O11 — Keep lifecycle maintenance conservative'''
          new = '''- [x] Decide additive `server_info` shape for operational pressure/inventory degradation
          - [x] Keep unavailable metrics distinguishable from healthy zero usage
          - [x] Preserve existing audit and maintenance health sections
          - [x] Do not make optional pressure probes block server startup
          - [x] Bump contract version and regenerate schemas/docs
          - [x] Test healthy, pressured, degraded-probe, and recovered states

          **O10 completion evidence:**

          - PMOAT-004/005/011 clean pre-feature RED: Actions run `33978569828`, job `101339525564`, on test-only head `dd52b635e55e7505e4e5770726b61cac16019947` passed Docker build, Ruff format/lint, mypy (`71 source files`), MCP contract, contract-version, and docs drift, then failed exactly the three new O10 acceptance cases because `server_info` had no additive `operations` field (`3 failed, 1178 passed in 605.21s`). All unrelated tests remained green. This is the direct revert/pre-feature proof for O10.
          - Public health shape: `server_info.operations` is additive and reports aggregate `healthy` / `pressured` / `degraded` state, bounded inventory completeness/diagnostic count, state-filesystem availability plus pressure/capacity/free values, and PID availability plus pressure/source/current/limit/utilization/unlimited/reason. Existing `audit` and `maintenance` health sections remain unchanged and present.
          - Availability semantics: unavailable optional state-filesystem or PID probes are represented as `status=unavailable`, `pressure=unknown`, and `None` measurements rather than fabricated zero usage. A genuine PID observation of `current=0` remains an available healthy zero with `utilization_percent=0.0`.
          - Conservative behavior: O10 reuses the bounded read-only inventory and O4 PID observation path. It performs no prune planning/execution, retention mutation, Docker stop/remove/prune, or cleanup authorization. Pressure merely changes health reporting; it does not cross the destructive boundary.
          - Startup/recovery semantics: optional probe failures degrade only the `operations` diagnostics and do not prevent server construction or ordinary tool registration. Because observations are recomputed per `server_info` call, a later healthy probe returns the health state to `healthy` without restart or sticky false degradation.
          - Contract/docs: the tool count remains 24; additive `server_info.operations` output bumps `contract_version` to `0.10.2`; canonical `schemas/tools.json` was regenerated from the running server and `docs/TOOLS.md` documents the operational-health contract. Schema, contract-version, and docs-drift gates pass.
          - Superseded non-behavioral implementation runs stopped at Ruff formatting/import-ordering or mypy type-boundary checks and are not O10 acceptance evidence. Those corrections changed formatting/export/type seams only, not the accepted runtime contract.
          - Final implementation GREEN: Actions run `33980756003`, job `101345418283`, on exact O10 head `eef1ffe4088580a704542afc78033ab30ca071ef` passed Docker build, Ruff format/lint, mypy (`72 source files`), MCP contract, contract-version, docs drift, and the complete Docker-backed suite: `1181 passed in 603.29s` with 92% overall coverage. The healthy, pressured, degraded-probe, and recovered O10 acceptance cases all pass in this generation.
          - Revert/pre-feature verification is the clean `33978569828` RED: removing O10 restores exactly the three missing `server_info.operations` failures while the prior 1178-test O9 baseline remains green.

          ### O11 — Keep lifecycle maintenance conservative'''
          if old not in text:
              raise SystemExit("O10 closure anchor did not match exactly")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit closure evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/POST_MVP_OPERATIONS_TODO.md
          git commit -m "docs: close O10 operational health evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
