name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # HR-029 (`docs/HARDENING_SPEC.md` §12): full history, not the
      # default shallow single-commit checkout — the contract_version
      # bump check below needs to `git show` the previous commit's
      # `schemas/tools.json`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # ubuntu-latest ships Docker pre-installed and running (§71's
      # "Docker-backed integration tests"); building here keeps the cost
      # visible instead of hiding inside the first test that needs it
      # (`tests/workspace/conftest.py`'s `default_image_tag` fixture
      # builds this same image lazily, from the same context and tag —
      # this step is a cache-warming duplicate of that build, not a
      # separate image). HR-029: this was `docker pull alpine:3.20`,
      # which is not, and never was, an image anything in this suite
      # actually uses (`docker/default/Dockerfile` is `FROM ubuntu:24.04`)
      # — pulling it proved nothing about whether the real test image
      # builds. The tag here MUST match `DEFAULT_IMAGE_TEST_TAG` in
      # `tests/workspace/conftest.py`.
      - name: Build test image
        run: docker build -t mcp-dev-test-s7:24.04 docker/default/

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      # §71's "MCP contract check": export-schemas output SHALL match the
      # committed schemas/tools.json byte-for-byte. `tests/test_schema_export.py`
      # already asserts this semantically on every pytest run; this step
      # additionally re-runs the real CLI and diffs raw bytes, so a
      # formatting-only drift (key order, whitespace) fails CI too.
      - name: MCP contract check (§33.1, §71)
        run: |
          config_dir="$(mktemp -d)"
          cat > "$config_dir/config.yml" <<EOF
          version: 1
          state_db_path: $config_dir/state.db
          docker:
            default_image: mcp-dev-ubuntu:24.04
          ssh:
            keys_dir: $config_dir/keys
            known_hosts: $config_dir/known_hosts
          audit:
            path: $config_dir/audit.jsonl
          EOF
          uv run dev-workspace-mcp export-schemas \
            --config "$config_dir/config.yml" \
            --out "$config_dir/tools.json"
          diff -u schemas/tools.json "$config_dir/tools.json" || {
            echo "::error::schemas/tools.json is stale — run 'dev-workspace-mcp export-schemas' and commit the result (bump contract_version per §33.2 if the change is intentional)";
            exit 1;
          }

      # §33.2: a tool-schema change SHALL bump contract_version. The
      # check above only catches schemas/tools.json drifting from what
      # the current source produces — it re-derives contract_version
      # from the same CONTRACT_VERSION constant on both sides of its
      # diff, so it cannot by itself tell "the schemas changed but
      # contract_version didn't" from "nothing changed at all." This
      # step is the git-history-aware half: compare this commit's tool
      # schemas (contract_version stripped) against the base commit's —
      # if they differ, contract_version SHALL have changed too.
      - name: contract_version bump check (§33.2)
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against (first commit on this branch) — skipping."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:schemas/tools.json" 2>/dev/null; then
            echo "Base commit has no schemas/tools.json yet — skipping."
            exit 0
          fi
          git show "$BASE_SHA:schemas/tools.json" > /tmp/base_tools.json
          OLD_VERSION=$(jq -r .contract_version /tmp/base_tools.json)
          NEW_VERSION=$(jq -r .contract_version schemas/tools.json)
          OLD_TOOLS=$(jq -S .tools /tmp/base_tools.json)
          NEW_TOOLS=$(jq -S .tools schemas/tools.json)
          if [ "$OLD_TOOLS" != "$NEW_TOOLS" ] && [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::schemas/tools.json's tool schemas changed since $BASE_SHA but contract_version ($NEW_VERSION) was not bumped (§33.2)";
            exit 1;
          fi

      # H33 (`docs/HARDENING_TODO.md`, HR-032): the tool table in
      # `docs/TOOLS.md` is generated by hand, not by a script (its own
      # module docstring) — the recurring failure mode that keeps
      # producing was a tool shipping without ever being added to it (six
      # structured Git tools, at once, before this task). Bidirectional:
      # a tool listed in the docs but no longer in the schema fails too,
      # catching a stale entry left behind after a tool is renamed or
      # removed, not only a missing one.
      - name: docs/TOOLS.md drift check (HR-032)
        run: |
          jq -r '.tools[].name' schemas/tools.json | sort -u > /tmp/schema_tools.txt
          grep -oP '(?<=^\| `)[a-z_]+(?=` \|)' docs/TOOLS.md | sort -u > /tmp/doc_tools.txt
          if ! diff -u /tmp/doc_tools.txt /tmp/schema_tools.txt; then
            echo "::error::docs/TOOLS.md's tool list has drifted from schemas/tools.json (HR-032) — add/remove the tool's row";
            exit 1;
          fi

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
