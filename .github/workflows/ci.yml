name: CI

on:
  push:
    branches: [master]
  pull_request:

# Temporary Y14 schema-sync needs to commit the exporter output back to this
# same-repository PR branch. This permission is removed with the helper once
# the generated file has been materialized.
permissions:
  contents: write

jobs:
  test:
    # Self-hosted (the `mcp-chatgpt-sandbox` runner) — GitHub-hosted
    # Actions minutes were exhausted (docs/GAP_TODO.md G1's "Actions
    # budget" failures), blocking every push from 2026-08-29 through
    # today. Both labels required: `self-hosted` alone would also match
    # any other self-hosted runner on this account; `mcp-chatgpt-sandbox`
    # alone would work too (unique to this repo) but pairing both is the
    # documented convention and makes the intent explicit at a glance.
    runs-on: [self-hosted, mcp-chatgpt-sandbox]
    steps:
      # HR-029 (`docs/HARDENING_SPEC.md` §12): full history, not the
      # default shallow single-commit checkout — the contract_version
      # bump check below needs to `git show` the previous commit's
      # `schemas/tools.json`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # Temporary, PR-18-only bridge: the connector can edit repository
      # text but cannot run the installed exporter and upload its generated
      # file. Generate the authoritative schema on the same runner CI uses,
      # commit only that file to the PR head, then remove this helper before
      # final validation.
      - name: Y14 temporary schema sync
        if: github.event_name == 'pull_request' && github.head_ref == 'gap3-y14-maintenance-scheduler'
        run: |
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          config_dir="$(mktemp -d)"
          cat > "$config_dir/config.yml" <<EOF
          version: 1
          state_db_path: $config_dir/state.db
          docker:
            default_image: mcp-dev-ubuntu:24.04
          ssh:
            keys_dir: $config_dir/keys
            known_hosts: $config_dir/known_hosts
          audit:
            path: $config_dir/audit.jsonl
          EOF
          uv run dev-workspace-mcp export-schemas \
            --config "$config_dir/config.yml" \
            --out schemas/tools.json
          if git diff --quiet -- schemas/tools.json; then
            echo "schemas/tools.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/tools.json
          git commit -m "chore: regenerate MCP tool schema"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # §71's "Docker-backed integration tests" needs a running Docker
      # daemon — true of `ubuntu-latest` by default; the self-hosted
      # runner above is expected to have one too, and this step is what
      # actually proves it rather than assuming it. Building here keeps
      # the cost visible instead of hiding inside the first test that
      # needs it
      # (`tests/workspace/conftest.py`'s `default_image_tag` fixture
      # builds this same image lazily, from the same context and tag —
      # this step is a cache-warming duplicate of that build, not a
      # separate image). HR-029: this was `docker pull alpine:3.20`,
      # which is not, and never was, an image anything in this suite
      # actually uses (`docker/default/Dockerfile` is `FROM ubuntu:24.04`)
      # — pulling it proved nothing about whether the real test image
      # builds. The tag here MUST match `DEFAULT_IMAGE_TEST_TAG` in
      # `tests/workspace/conftest.py`.
      - name: Build test image
        run: docker build -t mcp-dev-test-s7:24.04 docker/default/

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      # §71's "MCP contract check": export-schemas output SHALL match the
      # committed schemas/tools.json byte-for-byte. `tests/test_schema_export.py`
      # already asserts this semantically on every pytest run; this step
      # additionally re-runs the real CLI and diffs raw bytes, so a
      # formatting-only drift (key order, whitespace) fails CI too.
      - name: MCP contract check (§33.1, §71)
        run: |
          config_dir="$(mktemp -d)"
          cat > "$config_dir/config.yml" <<EOF
          version: 1
          state_db_path: $config_dir/state.db
          docker:
            default_image: mcp-dev-ubuntu:24.04
          ssh:
            keys_dir: $config_dir/keys
            known_hosts: $config_dir/known_hosts
          audit:
            path: $config_dir/audit.jsonl
          EOF
          uv run dev-workspace-mcp export-schemas \
            --config "$config_dir/config.yml" \
            --out "$config_dir/tools.json"
          diff -u schemas/tools.json "$config_dir/tools.json" || {
            echo "::error::schemas/tools.json is stale — run 'dev-workspace-mcp export-schemas' and commit the result (bump contract_version per §33.2 if the change is intentional)";
            exit 1;
          }

      # §33.2: a tool-schema change SHALL bump contract_version. The
      # check above only catches schemas/tools.json drifting from what
      # the current source produces — it re-derives contract_version
      # from the same CONTRACT_VERSION constant on both sides of its
      # diff, so it cannot by itself tell "the schemas changed but
      # contract_version didn't" from "nothing changed at all." This
      # step is the git-history-aware half: compare this commit's tool
      # schemas (contract_version stripped) against the base commit's —
      # if they differ, contract_version SHALL have changed too.
      - name: contract_version bump check (§33.2)
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against (first commit on this branch) — skipping."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:schemas/tools.json" 2>/dev/null; then
            echo "Base commit has no schemas/tools.json yet — skipping."
            exit 0
          fi
          git show "$BASE_SHA:schemas/tools.json" > /tmp/base_tools.json
          OLD_VERSION=$(jq -r .contract_version /tmp/base_tools.json)
          NEW_VERSION=$(jq -r .contract_version schemas/tools.json)
          # RR-028 (`docs/REMEDIATION_SPEC.md` §28): `jq -S` sorts object
          # *keys* within each array element, but `.tools` is itself an
          # array — `-S` never reorders array elements, so a pure
          # reordering of the tool array (no schema content changed at
          # all) still diffs different and falsely demands a version
          # bump. Sorted by tool name first, so only a genuine schema
          # change — not a cosmetic reshuffle — makes these differ.
          OLD_TOOLS=$(jq -S '.tools | sort_by(.name)' /tmp/base_tools.json)
          NEW_TOOLS=$(jq -S '.tools | sort_by(.name)' schemas/tools.json)
          if [ "$OLD_TOOLS" != "$NEW_TOOLS" ] && [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::schemas/tools.json's tool schemas changed since $BASE_SHA but contract_version ($NEW_VERSION) was not bumped (§33.2)";
            exit 1;
          fi
          # RR-028: `contract_version` is a semver string (`0.7.5`, not a
          # plain integer), so a plain string/numeric comparison cannot
          # detect a regression — `sort -V` (version sort) can. A
          # *decrease* is rejected unconditionally, independent of
          # whether the tool schemas themselves changed: the check above
          # only ever asks "did it change at all", never "did it move in
          # the right direction", so `0.7.5` -> `0.7.4` silently passed.
          HIGHEST_VERSION=$(printf '%s\n%s' "$OLD_VERSION" "$NEW_VERSION" | sort -V | tail -1)
          if [ "$HIGHEST_VERSION" != "$NEW_VERSION" ]; then
            echo "::error::contract_version SHALL be monotonically increasing (§33.2): $OLD_VERSION -> $NEW_VERSION is a decrease";
            exit 1;
          fi

      # H33 (`docs/HARDENING_TODO.md`, HR-032): the tool table in
      # `docs/TOOLS.md` is generated by hand, not by a script (its own
      # module docstring) — the recurring failure mode that keeps
      # producing was a tool shipping without ever being added to it (six
      # structured Git tools, at once, before this task). Bidirectional:
      # a tool listed in the docs but no longer in the schema fails too,
      # catching a stale entry left behind after a tool is renamed or
      # removed, not only a missing one.
      - name: docs/TOOLS.md drift check (HR-032)
        run: |
          jq -r '.tools[].name' schemas/tools.json | sort -u > /tmp/schema_tools.txt
          # RR-028: `[a-z_]+` excludes a digit — a future tool name
          # containing one (e.g. an `oauth2`-shaped name) would still be
          # present in the table but silently fail to match here, making
          # this check report it as *missing* from the docs (a spurious
          # failure on a correct row) rather than catching a genuine
          # drift. Widened to every character an actual tool name can
          # contain (lowercase, digits, underscore — matching this
          # project's own naming convention, not just today's names).
          grep -oP '(?<=^\| `)[a-z0-9_]+(?=` \|)' docs/TOOLS.md | sort -u > /tmp/doc_tools.txt
          if ! diff -u /tmp/doc_tools.txt /tmp/schema_tools.txt; then
            echo "::error::docs/TOOLS.md's tool list has drifted from schemas/tools.json (HR-032) — add/remove the tool's row";
            exit 1;
          fi

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
