name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # ubuntu-latest ships Docker pre-installed and running (§71's
      # "Docker-backed integration tests"); pulling here keeps the cost
      # visible instead of hiding inside the first test that needs it.
      - name: Pull test image
        run: docker pull alpine:3.20

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
