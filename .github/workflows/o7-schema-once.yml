name: O7 schema once

on:
  push:
    branches:
      - post-mvp/o7-resource-prune-plan

permissions:
  contents: write

jobs:
  export-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, mcp-chatgpt-sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-mvp/o7-resource-prune-plan
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Export canonical MCP schema
        run: |
          config_dir="$(mktemp -d)"
          cat > "$config_dir/config.yml" <<EOF
          version: 1
          state_db_path: $config_dir/state.db
          docker:
            default_image: mcp-dev-ubuntu:24.04
          ssh:
            keys_dir: $config_dir/keys
            known_hosts: $config_dir/known_hosts
          audit:
            path: $config_dir/audit.jsonl
          EOF
          uv run dev-workspace-mcp export-schemas \
            --config "$config_dir/config.yml" \
            --out schemas/tools.json
      - name: Commit schema if changed
        run: |
          if git diff --quiet -- schemas/tools.json; then
            echo "schemas/tools.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/tools.json
          git commit -m "chore: regenerate O7 MCP schema"
          git push origin HEAD:post-mvp/o7-resource-prune-plan
