name: O5 atomic apply

on:
  push:
    branches:
      - post-mvp/o5-prune-candidates
    paths:
      - .github/workflows/o5-atomic-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, mcp-chatgpt-sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-mvp/o5-prune-candidates
          fetch-depth: 0
      - name: Apply O5 implementation atomically
        env:
          EXPECTED_PATCH_SHA256: 61c2a449429ffe993b940b3ca8acc74c43b0618c5bde8d36d517aa76a9e0f20a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$EXPECTED_PATCH_SHA256  .github/o5-implementation.patch" | sha256sum -c -
          git apply --check .github/o5-implementation.patch
          git apply .github/o5-implementation.patch
          rm .github/o5-implementation.patch .github/workflows/o5-atomic-apply.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build deterministic prune candidates"
          git push origin HEAD:post-mvp/o5-prune-candidates
