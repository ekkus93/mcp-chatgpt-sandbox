name: O11 Close TODO

on:
  push:
    branches: [post-mvp/o11-conservative-maintenance]
    paths: [.github/workflows/o11-close-todo.yml]

permissions:
  contents: write

jobs:
  close:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-mvp/o11-conservative-maintenance
      - run: python scripts/o11_close_todo.py
      - run: git rm .github/workflows/o11-close-todo.yml scripts/o11_close_todo.py
      - run: |
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add docs/POST_MVP_OPERATIONS_TODO.md
          git commit -m "docs: close O11 conservative maintenance"
          git push origin HEAD:post-mvp/o11-conservative-maintenance
