name: O12 Close Workstream

on:
  push:
    branches:
      - post-mvp/o12-reclamation-audit
    paths:
      - .github/workflows/o12-close-workstream.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-mvp/o12-reclamation-audit
      - run: python scripts/o12_close_workstream.py
      - run: git rm .github/workflows/o12-close-workstream.yml scripts/o12_close_workstream.py
      - run: |
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add docs/TOOLS.md docs/POST_MVP_OPERATIONS_SPEC.md docs/POST_MVP_OPERATIONS_TODO.md
          git commit -m "docs: close O12 post-MVP operations workstream"
          git push origin HEAD:post-mvp/o12-reclamation-audit
