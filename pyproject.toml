[project]
name = "dev-workspace-mcp"
version = "0.1.0"
description = "Private MCP server providing Docker-backed development workspaces to ChatGPT and other MCP clients"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Phillip Chin", email = "ekkus93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "docker>=7.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "textual>=8.2,<9",
]

[project.scripts]
dev-workspace-mcp = "dev_workspace_mcp.entrypoint:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "pytest-asyncio>=1.4.0",
    "types-docker>=7.2.0.20260819",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# G2R-020 (`docs/GAP2_SPEC.md`): without an explicit `src`, ruff's isort
# looks for a first-party package at every top-level directory — and
# this repository has one named `docker/` (image/entrypoint assets, not
# Python), which ruff has no way to distinguish from a local package by
# name alone. That ambiguity split one distribution's imports across two
# sections (`import docker` sorted as first-party, `from docker.errors
# import ...` as third-party) — the actual shape G1 (`docs/GAP_SPEC.md`)
# reproduced, and `workspace/manager_core.py`'s own import block still
# carries. G1 pinned the ruff *version* without closing the ambiguity
# itself, so a different tool (or a future ruff release with different
# default source detection) could reopen it. Declaring the real source
# root removes the ambiguity at its cause, rather than special-casing
# `docker` by name in `known-third-party`.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/dev_workspace_mcp"]
